<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Simple Weather App</title>
    <link rel="stylesheet" href="../../css/project-back-link.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous"/>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>
    <a class="project-back-link" href="../../proyectos.html" aria-label="Volver a VlogSpace">
        <span class="project-back-link__arrow" aria-hidden="true">←</span>
        <span class="project-back-link__label">Volver a VlogSpace</span>
    </a>
    <section class="top-banner">
        <div class="container">
            <h3 class="heading">Simple Weather App</h3>
            <form>
                <input placeholder="Busque una ciudad" autofocus/>
                <button type="submit">BUSCAR</button>
                <span class="msg"></span>
            </form>
        </div>
    </section>
    <section class="ajax-section">
        <div class="container">
            <ul class="cities"></ul>
        </div>
    </section>
    <script src="main.bundle.js"></script>
</body>
</html>
